services:
  - type: web
    name: cyber-junction
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: CJ_DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: CJ_DB_PORT
        value: "5432"
      - key: CJ_DB_NAME
        value: postgres
      - key: CJ_DB_USER
        value: postgres.twhoqfhedhqaoknygbsg
      - key: CJ_DB_PASSWORD
        sync: false
      - key: CJ_APP_KEY
        sync: false
      - key: CJ_ADMIN_SETUP_KEY
        sync: false
      - key: CJ_BASE_URL
        value: https://cyber-junction.onrender.com
      - key: CJ_TIMEZONE
        value: Asia/Kolkata
